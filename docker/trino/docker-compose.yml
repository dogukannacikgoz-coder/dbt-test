# Lokal Trino + Iceberg REST catalog + MinIO (S3)
#   docker compose -f docker/trino/docker-compose.yml up -d
#   Trino UI: http://localhost:8080   MinIO console: http://localhost:9001 (admin / password)
# Image versiyonlarını kendi ortamınızın (Artifactory) versiyonlarına sabitleyin.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports: ["9000:9000", "9001:9001"]
  mc:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 admin password; do sleep 1; done;
                  mc mb -p local/warehouse; exit 0"
  rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on: [minio]
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    ports: ["8181:8181"]
  trino:
    image: trinodb/trino:470
    depends_on: [rest, minio]
    ports: ["8080:8080"]
    volumes:
      - ./catalog:/etc/trino/catalog
