version: 2
sources:
  - name: src
    schema: "{{ env_var('ORA_SCHEMA', env_var('ORA_USER', 'odi_test')) | upper }}"
    tables:
      - name: src_customer
        identifier: "{{ env_var('ODI_NAME_PREFIX', '') }}SRC_CUSTOMER"
        description: Müşteri tam liste (her gün tamamı)
      - name: src_customer_cdc
        identifier: "{{ env_var('ODI_NAME_PREFIX', '') }}SRC_CUSTOMER_CDC"
        description: Müşteri CDC — sadece değişenler, OP_TYPE I/U/D
      - name: src_customer_snap
        identifier: "{{ env_var('ODI_NAME_PREFIX', '') }}SRC_CUSTOMER_SNAP"
        description: Müşteri snapshot — kaynakta silinen artık gelmez
      - name: src_txn
        identifier: "{{ env_var('ODI_NAME_PREFIX', '') }}SRC_TXN"
        description: İşlemler (partition örnekleri)
      - name: d_branch
        identifier: "{{ env_var('ODI_NAME_PREFIX', '') }}D_BRANCH"
        description: Şube referansı
