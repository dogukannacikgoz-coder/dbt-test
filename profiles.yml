odi_dbt:
  target: dev
  outputs:
    dev:
      type: oracle
      host: "{{ env_var('ORA_HOST', 'localhost') }}"
      port: "{{ env_var('ORA_PORT', '1521') | int }}"
      service: "{{ env_var('ORA_SERVICE', 'FREEPDB1') }}"
      database: "{{ env_var('ORA_SERVICE', 'FREEPDB1') }}"
      user: "{{ env_var('ORA_USER', 'odi_test') }}"
      password: "{{ env_var('ORA_PWD', 'odi_test') }}"
      schema: "{{ env_var('ORA_USER', 'odi_test') | upper }}"
      protocol: tcp
      threads: 1
    # dbt run --target trino   (Iceberg catalog; lokal kurulum: docker/trino/docker-compose.yml)
    trino:
      type: trino
      method: none
      http_scheme: "{{ env_var('TRINO_SCHEME', 'http') }}"
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'admin') }}"
      database: "{{ env_var('TRINO_CATALOG', 'iceberg') }}"
      schema: "{{ env_var('TRINO_SCHEMA', 'odi_test') }}"
      threads: 1
